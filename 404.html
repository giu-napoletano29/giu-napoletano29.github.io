<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina non trovata — Giuseppe Napoletano</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .oops{ min-height:100vh; display:grid; place-items:center; text-align:center; padding:40px 24px; }
  .oops-code{ font-size:clamp(4rem,14vw,8rem); font-weight:800; letter-spacing:-.05em;
              color:var(--navy); line-height:1; margin:0 0 8px; }
  .oops p{ color:var(--ink-soft); max-width:44ch; margin:0 auto 28px; }
</style>
</head>
<body>
  <main class="oops">
    <div>
      <p class="oops-code">404</p>
      <h1 style="margin-bottom:16px">Questa pagina non esiste</h1>
      <p>Forse il link è vecchio o c'è un refuso nell'indirizzo. Torna alla home: da lì trovi servizi, progetti e contatti.</p>
      <a class="btn btn-primary" href="/">Torna alla home</a>
    </div>
  </main>
</body>
</html>
